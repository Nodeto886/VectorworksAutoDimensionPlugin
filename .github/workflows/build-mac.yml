name: Build Vectorworks Mac plugin

on:
  push:
    branches: [main, codex/**]
    paths:
      - 'include/**'
      - 'sdk-projects/**'
      - 'src/**'
      - 'scripts/build-release-mac.sh'
      - '.github/workflows/build-mac.yml'
  pull_request:
    paths:
      - 'include/**'
      - 'sdk-projects/**'
      - 'src/**'
      - 'scripts/build-release-mac.sh'
      - '.github/workflows/build-mac.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Upload Mac ZIPs to the configured Cloudflare R2 bucket
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    env:
      R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.VECTORWORKS_SDK_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.VECTORWORKS_SDK_R2_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        version: [2025, 2026]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Vectorworks Mac SDK
        shell: bash
        env:
          SDK_SHA256: ${{ matrix.version == 2025 && secrets.VECTORWORKS_MAC_SDK_2025_SHA256 || secrets.VECTORWORKS_MAC_SDK_2026_SHA256 }}
        run: |
          set -euo pipefail
          : "${R2_ENDPOINT:?Set CLOUDFLARE_R2_ENDPOINT}"
          : "${R2_BUCKET:?Set CLOUDFLARE_R2_BUCKET}"
          : "${R2_ACCESS_KEY_ID:?Set VECTORWORKS_SDK_R2_ACCESS_KEY_ID}"
          : "${R2_SECRET_ACCESS_KEY:?Set VECTORWORKS_SDK_R2_SECRET_ACCESS_KEY}"
          : "${SDK_SHA256:?Set the version-specific Vectorworks Mac SDK SHA256 secret}"
          # The private R2 SDK objects are the official Vectorworks Mac SDK ZIPs.
          archive="$RUNNER_TEMP/vectorworks-mac-sdk-${{ matrix.version }}.zip"
          AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
          AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
          AWS_DEFAULT_REGION=auto \
          aws s3 cp \
            "s3://$R2_BUCKET/sdk/Vectorworks-${{ matrix.version }}-mac-SDK.zip" \
            "$archive" \
            --endpoint-url "$R2_ENDPOINT"
          echo "$SDK_SHA256  $archive" | shasum -a 256 --check -
          mkdir -p "$RUNNER_TEMP/vectorworks-sdk"
          unzip -q "$archive" -d "$RUNNER_TEMP/vectorworks-sdk"
          rm -rf "$RUNNER_TEMP/vectorworks-sdk/__MACOSX"
          sdk_lib="$(find "$RUNNER_TEMP/vectorworks-sdk" -type d -name SDKLib -print -quit)"
          [[ -n "$sdk_lib" && -d "$sdk_lib/Include" && -d "$sdk_lib/LibMac" ]]
          [[ -f "$sdk_lib/Source/VWSDK/VWFC/VWUI/DialogData.h" ]]
          chmod +x "$sdk_lib/ToolsMac/BuildVWR/BuildVWR"
          [[ -x "$sdk_lib/ToolsMac/BuildVWR/BuildVWR" ]]
          echo "SDK_ROOT=$sdk_lib" >> "$GITHUB_ENV"

      - name: Build Vectorworks Mac plugin
        run: bash scripts/build-release-mac.sh --version "${{ matrix.version }}" --sdk-root "$SDK_ROOT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vectorworks-mac-${{ matrix.version }}
          path: dist/mac/Keepl-Auto-Dimension-Vectorworks-${{ matrix.version }}-Mac.zip
          if-no-files-found: error

      - name: Configure AWS CLI for Cloudflare R2
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          : "${AWS_ACCESS_KEY_ID:?Set CLOUDFLARE_R2_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?Set CLOUDFLARE_R2_SECRET_ACCESS_KEY}"

      - name: Publish Mac ZIPs to Cloudflare R2
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          : "${R2_ENDPOINT:?Set CLOUDFLARE_R2_ENDPOINT}"
          : "${R2_BUCKET:?Set CLOUDFLARE_R2_BUCKET}"
          archive="dist/mac/Keepl-Auto-Dimension-Vectorworks-${{ matrix.version }}-Mac.zip"
          aws s3 cp "$archive" "s3://$R2_BUCKET/vectorworks/$(basename "$archive")" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/zip \
              --cache-control 'public, max-age=0, must-revalidate'
